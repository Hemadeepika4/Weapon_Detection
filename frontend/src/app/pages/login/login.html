<div class="auth-shell">
  <div class="bg-grid"></div>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="bg-glow glow-3"></div>

  <div class="auth-layout">
    <div class="auth-left">
      <div class="brand-chip">AI Security Platform</div>
      <h1>Real-Time<br />Weapon Detection</h1>
      <p>
        Secure access to an intelligent detection system
      </p>
    </div>

    <div class="auth-right">
      <div class="auth-card">
        <div class="card-shine"></div>

        <div class="card-top">
          <span class="mini-badge">Login</span>
          <h2>Welcome Back</h2>
          <p>Sign in to continue to your detection dashboard</p>
        </div>

        <form (ngSubmit)="onLogin()" class="auth-form">
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-box">
              <span class="input-icon">✉</span>
              <input
                type="email"
                [(ngModel)]="email"
                name="email"
                placeholder="Enter your email"
              />
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-box">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                [(ngModel)]="password"
                name="password"
                placeholder="Enter your password"
              />
            </div>
          </div>

          <button type="submit" [disabled]="loading" class="auth-btn">
            {{ loading ? 'Logging in...' : 'Login' }}
          </button>

          <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
          <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
        </form>

        <div class="auth-footer">
          <span>New user?</span>
          <a routerLink="/signup">Create an account</a>
        </div>
      </div>
    </div>
  </div>
</div>
